[project]
name = "hw02-code-generation"
version = "0.1.0"
description = "Training an encoder-decoder Transformer for code generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "comet-ml>=3.50,<4",
    "datasets==5.0.1",
    "numpy==2.5.3",
    "tokenizers==0.23.2",
    "torch==2.7.1",
    "transformers==5.18.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download-r2.pytorch.org/whl/cu118"
explicit = true
